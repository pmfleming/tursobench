name: Linux preview package
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: sudo apt-get update && sudo apt-get install -y weston libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libdbus-1-3
      - run: cargo test --workspace --locked
      - run: bash scripts/package-linux.sh
      - run: TURSOBENCH_BINARY=target/release/tursobench bash scripts/desktop-smoke.sh
      - run: TURSOBENCH_BINARY=target/release/tursobench bash scripts/discovery-smoke.sh
      - run: TURSOBENCH_BINARY=target/release/tursobench bash scripts/local-project-smoke.sh
      - run: bash scripts/package-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-wayland-smoke-logs
          path: target/wayland-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tursobench-linux-preview
          path: |
            target/tursobench-*.tar.gz
            target/tursobench-*.sha256

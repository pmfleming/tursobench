name: Rust
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y weston libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libdbus-1-3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p engine-spike
      - run: cargo build --workspace --locked
      - run: bash scripts/desktop-smoke.sh
      - run: bash scripts/discovery-smoke.sh
      - run: bash scripts/local-project-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wayland-smoke-logs
          path: target/wayland-smoke/
          if-no-files-found: ignore
  x11-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - run: cargo check --locked -p tursobench-ui --all-targets --no-default-features --features x11

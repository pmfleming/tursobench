[workspace]
resolver = "2"
members = ["tools/engine-spike", "crates/tursobench-core", "crates/tursobench-db", "crates/tursobench-ui"]
exclude = ["vendor/tantivy-sstable", "vendor/turso"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
tursobench-core = { path = "crates/tursobench-core" }
tursobench-db = { path = "crates/tursobench-db" }
turso_parser = "=0.8.3"
turso_core = { version = "=0.8.3", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
turso = { version = "=0.8.3", default-features = false, features = ["fts"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# Expose existing SDK interrupt/deadline methods without changing engine version.
turso = { path = "vendor/turso" }
# Turso's Tantivy dependency otherwise constrains zstd to a vulnerable 0.13 release.
tantivy-sstable = { path = "vendor/tantivy-sstable" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

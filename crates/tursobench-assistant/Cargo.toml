[package]
name = "tursobench-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true

# Drives the user's own signed-in agent CLI and serves it TursoBench tools.
# No network, TLS or credential handling: the agent owns its own sign-in.
[dependencies]
serde.workspace = true
serde_json.workspace = true
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

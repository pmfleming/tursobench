/* One compact content ribbon per tile; only minimized tiles become title bars. */
.content-ribbon{display:flex;align-items:center;gap:10px;min-height:47px;flex:none;padding:7px 72px 7px 14px;min-width:0}
.ribbon-identity{display:flex;gap:7px;align-items:center;min-width:0;flex-shrink:1}
.ribbon-identity>.icon{color:var(--primary);width:16px;height:16px}
.ribbon-identity h1,.ribbon-identity h2{font-size:13px;font-weight:620;letter-spacing:0;white-space:nowrap;line-height:1.3}
.ribbon-identity h1{overflow:hidden;text-overflow:ellipsis}
.ribbon-context>span{display:none}.ribbon-context{font:11px var(--font-mono);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#record-id{font-size:10px;white-space:nowrap}
.ribbon-actions{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;flex:none}
.ribbon-group{display:flex;align-items:center;gap:2px}
.ribbon-group+.ribbon-group{padding-left:6px;border-left:1px solid var(--border)}
.ribbon-group button{min-width:29px;height:29px;padding:5px 6px;font-size:11px}
.ribbon-group button .icon{width:16px;height:16px}
.ribbon-group .primary{padding:5px 9px}
.ribbon-group .access-control[aria-pressed=true]{background:var(--accent);color:var(--primary);border-color:var(--border)}
#zoom-label{font-size:10px;min-width:31px;text-align:center}
.tile-controls,.full .tile-controls{top:9px;right:9px;border-left:1px solid var(--border);border-radius:0;padding-left:5px}
.tile-controls .icon-button{width:25px;height:27px}
.tile[data-tile=map]{flex:.85}
.tile[data-tile=data]{flex:1.35}
.filter-line{padding:0 14px 9px}
.filter-line input,.filter-line select{height:29px;padding:4px 7px}
.record-fields{padding-top:3px}
.map-caption{padding:5px 14px}
.schema-body{padding-top:3px}
.query-input{margin-top:2px}
.workspace.has-focus .content-ribbon{padding-right:78px}
.full .ribbon-identity h1,.full .ribbon-identity h2{font-size:15px}
@media(max-width:1350px){
 .content-ribbon{gap:5px;padding:6px 62px 6px 10px;min-height:43px}
 .ribbon-identity{gap:5px}.ribbon-identity h1,.ribbon-identity h2{font-size:12px}
 .ribbon-actions{gap:3px}.ribbon-group{gap:0}.ribbon-group+.ribbon-group{padding-left:3px}
 .ribbon-group button{min-width:25px;height:27px;padding:4px}
 .ribbon-group button .icon{width:15px;height:15px}
 .tile-controls,.full .tile-controls{top:8px;right:5px;padding-left:3px}
 .tile-controls .icon-button{width:23px;height:26px}
 .ribbon-identity h1>span,.ribbon-context>span{display:none}
 .action-label{display:none}.ribbon-group .primary .action-label{display:inline}
 .ribbon-context{max-width:65px;font-size:10px}
 .filter-line{padding:0 10px 7px}
}
@media(max-width:1080px){.ribbon-identity>.icon{display:none}.ribbon-identity h2{font-size:11px}.ribbon-context{max-width:42px}#record-id{display:none}.ribbon-group button{min-width:23px;padding:3px}.ribbon-actions{gap:2px}.ribbon-group+.ribbon-group{padding-left:2px}}

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const names={data:'Table data',map:'Relationships',record:'Selected record',structure:'Structure',sql:'SQL editor'};
const state={table:'tasks',selection:1,map:'tasks',minimized:new Set(),full:null,editing:false,page:0,filter:'',status:'',drafts:new Map(),zoom:1,mapColumns:true,presentation:'auto',history:[],database:'studio.db'};
const projects=[{id:1,name:'TursoBench',owner_id:1},{id:2,name:'Design system',owner_id:2},{id:3,name:'Local first',owner_id:3}];
const people=[{id:1,name:'Alex Morgan',email:'alex@studio.example'},{id:2,name:'Sam Chen',email:'sam@studio.example'},{id:3,name:'Jordan Lee',email:'jordan@studio.example'}];
const titles=['Design token audit','Relationship navigation','Keyboard shortcuts','Database switcher','Polish empty states','Review staged changes','Column value previews','Responsive table layout','System theme support','Typed filter editor','Connection diagnostics','Accessible map controls','Record detail layout','Query history search','Export selected rows','Composite key lookup','Schema search','Inline edit feedback','Column display rules','Inspect foreign keys','Database previews','Map focus states','Saved queries','Pagination controls'];
const tasks=titles.map((title,i)=>({id:i+1,title,project_id:(i%3)+1,assignee_id:(i%3)+1,status:['In progress','In progress','Review','Done','To do','Review'][i%6],priority:['High','Medium','Low'][i%3]}));
const schema={tasks:[['id','INTEGER','PK'],['title','TEXT',''],['project_id','INTEGER','projects'],['assignee_id','INTEGER','people'],['status','TEXT',''],['priority','TEXT','']],projects:[['id','INTEGER','PK'],['name','TEXT',''],['owner_id','INTEGER','people']],people:[['id','INTEGER','PK'],['name','TEXT',''],['email','TEXT','']]};
const initial=()=>({tasks:tasks.map(r=>({...r})),projects:projects.map(r=>({...r})),people:people.map(r=>({...r}))});
const databases={'studio.db':initial(),'sandbox.db':initial()};
function rows(table=state.table){return databases[state.database][table];}
function displayed(row){return state.drafts.get(`${state.table}:${row.id}`)?.after||row;}
function fkName(table,id){return rows(table).find(r=>r.id===Number(id))?.name??String(id);}
function statusClass(s){return ({'In progress':'progress','Review':'review','Done':'done','To do':'todo'})[s]||'todo';}
function valueHtml(col,value){const relation=schema[state.table].find(c=>c[0]===col)?.[2];if(relation&&relation!=='PK')return `<button class="fk" data-parent="${relation}" data-id="${esc(value)}">${icon('arrow')}${esc(fkName(relation,value))}</button>`;if(state.presentation!=='plain'&&col==='status')return `<span class="pill ${statusClass(value)}">${esc(value)}</span>`;if(state.presentation!=='plain'&&col==='priority')return `<span class="priority"><span class="bars"><i></i><i style="opacity:${value==='Low'?.2:1}"></i><i style="opacity:${value==='High'?1:.2}"></i></span>${esc(value)}</span>`;return esc(value);}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3200);$('#status-message').textContent=message;}
function showDialog(title,content){$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=content;if(!$('#dialog').open)$('#dialog').showModal();}
function closeDialog(){$('#dialog').close();}
function syncLayout(){$('#workspace').classList.toggle('has-focus',!!state.full);$$('.tile').forEach(tile=>{const id=tile.dataset.tile;tile.classList.toggle('minimized',state.minimized.has(id));tile.classList.toggle('full',state.full===id);const expand=tile.querySelector('[data-expand]');expand.innerHTML=icon(state.full===id?'restore':'expand');expand.title=state.full===id?'Return to all tiles':`Expand ${names[id]} to workspace`;expand.setAttribute('aria-label',expand.title);tile.querySelector('.tile-content').inert=state.minimized.has(id);});}
function minimize(id){if(state.full===id)state.full=null;state.minimized.add(id);syncLayout();$(`[data-tile="${id}"] .restore-label`).focus();}
function expand(id){state.minimized.delete(id);state.full=state.full===id?null:id;syncLayout();$(`[data-tile="${id}"] [data-expand]`).focus();}
function focusTile(id){state.minimized.delete(id);if(state.full)state.full=id;syncLayout();$(`[data-tile="${id}"] [data-expand]`).focus();}
function tableSelect(name,id){state.table=name;state.selection=id??rows(name)[0]?.id;state.page=0;state.filter='';state.status='';state.map=name;$('#row-filter').value='';$('#status-filter').value='';render();focusTile('data');}
function renderSidebar(){const q=$('#schema-search').value.toLowerCase();$('#table-list').innerHTML=Object.keys(schema).filter(t=>(t+' '+schema[t].map(c=>c[0]).join(' ')).includes(q)).map(t=>`<button class="table-choice ${state.table===t?'selected':''}" data-table="${t}">${icon('table')}<span>${t}</span><span class="count">${rows(t).length}</span></button>${state.table===t?`<div class="columns">${schema[t].map(c=>`<div class="column"><span style="color:${c[2]==='PK'?'var(--warning)':'var(--muted-foreground)'}">${c[2]==='PK'?'⌑':c[2]?'↗':'·'}</span><span class="mono">${c[0]}</span><span class="type">${c[1]}</span></div>`).join('')}</div>`:''}`).join('');}
function filtered(){return rows().filter(r=>Object.values(r).join(' ').toLowerCase().includes(state.filter.toLowerCase())&&(!state.status||r.status===state.status));}
function renderGrid(){const all=filtered(),size=7;state.page=Math.max(0,Math.min(state.page,Math.max(0,Math.ceil(all.length/size)-1)));const page=all.slice(state.page*size,(state.page+1)*size);const cols=schema[state.table];$('#table-title').innerHTML=`${state.table} <span class="muted" style="font-size:12px;font-weight:400;letter-spacing:0">/ main</span>`;$('#data-grid thead').innerHTML=`<tr><th>#</th>${cols.filter(c=>c[0]!=='id').map(c=>`<th class="${c[0]==='assignee_id'?'optional':''}">${c[0].replace('_id','')}<small>${c[1]}${c[2]?' ↗':''}</small></th>`).join('')}</tr>`;$('#data-grid tbody').innerHTML=page.map(r=>{const d=displayed(r),deleted=state.drafts.get(`${state.table}:${r.id}`)?.deleted;return `<tr data-row="${r.id}" tabindex="0" aria-selected="${r.id===state.selection}" class="${r.id===state.selection?'selected':''}" style="${deleted?'opacity:.45;text-decoration:line-through':''}"><td>${String(r.id).padStart(2,'0')}</td>${cols.filter(c=>c[0]!=='id').map(c=>`<td class="${c[0]==='assignee_id'?'optional':''}">${valueHtml(c[0],d[c[0]])}</td>`).join('')}</tr>`;}).join('')||'<tr><td colspan="7" class="empty">No rows match. Clear or change the filters.</td></tr>';$('#range-label').textContent=`${all.length?state.page*size+1:0}–${Math.min((state.page+1)*size,all.length)} of ${all.length} ${state.filter||state.status?'matching ':''}rows`;$('#page-label').textContent=`${state.page+1} / ${Math.max(1,Math.ceil(all.length/size))}`;$('[data-action=previous]').disabled=state.page===0;$('[data-action=next]').disabled=(state.page+1)*size>=all.length;$('#filter-chips').hidden=!state.filter&&!state.status;$('#filter-chips').innerHTML=[state.filter&&`contains “${esc(state.filter)}”`,state.status&&`status = ${esc(state.status)}`].filter(Boolean).map(label=>`<span class="chip">${label}<button data-action="clear-filter" aria-label="Clear filters">×</button></span>`).join('');$('#status-filter').hidden=state.table!=='tasks';$('#edit-dock').hidden=!state.drafts.size;$('#draft-label').textContent=`${state.drafts.size} staged ${state.drafts.size===1?'edit':'edits'}`;}
function renderRecord(){const row=rows().find(r=>r.id===state.selection);if(!row){$('#record-id').textContent='';$('#record-title').textContent='No record selected';$('#record-fields').innerHTML='<span class="muted">Select a row</span>';return;}const current=displayed(row);$('#record-id').textContent=`/ ${String(row.id).padStart(2,'0')}`;$('#record-title').textContent=current.title||current.name;$('#access-button').innerHTML=icon(state.editing?'edit':'lock');$('#access-button').title=state.editing?'Editing enabled — switch to read only':'Read only — enable editing';$('#access-button').setAttribute('aria-label',$('#access-button').title);$('#access-button').setAttribute('aria-pressed',state.editing);$('#access-status').textContent=state.editing?'Editing':'Read only';$('#record-fields').innerHTML=schema[state.table].map(([col,type,rel])=>{let field;if(col==='id')field=`<span class="mono">${row.id} <small>primary key</small></span>`;else if(rel)field=valueHtml(col,current[col]);else if(col==='status'||col==='priority'){const choices=col==='status'?['To do','In progress','Review','Done']:['High','Medium','Low'];field=`<select data-field="${col}" id="field-${col}" ${state.editing?'':'disabled'}>${choices.map(v=>`<option ${v===current[col]?'selected':''}>${v}</option>`).join('')}</select>`;}else field=`<input data-field="${col}" id="field-${col}" value="${esc(current[col])}" ${state.editing?'':'disabled'} class="${current[col]!==row[col]?'staged':''}">`;return `<label ${!rel&&col!=='id'?`for="field-${col}"`:''}>${col}</label><div>${field}</div>`;}).join('');$('#record-related').textContent=state.table==='tasks'?'Foreign keys open the referenced record':`${rows('tasks').filter(t=>t[state.table==='people'?'assignee_id':'project_id']===row.id).length} tasks reference this record`;}
function ddl(){return `CREATE TABLE ${state.table} (\n${schema[state.table].map(([n,t,r])=>`  ${n} ${t}${r==='PK'?' PRIMARY KEY':r?` REFERENCES ${r}(id)`:''}`).join(',\n')}\n);`;}
function renderStructure(){const cols=schema[state.table];$('#structure-title').innerHTML=`${state.table} <span class="muted" style="font-size:11px;font-weight:400">/ ${cols.length} columns</span>`;$('#structure-body').innerHTML=`<div class="schema-fields">${cols.map(([c,t,r])=>`<code>${r==='PK'?'<span style="color:var(--warning)">⌑</span> ':r?'↗ ':''}${c}</code><span class="type">${t}${r==='PK'?' · PK':''}</span>`).join('')}</div><div class="schema-section"><div class="eyebrow">Relationships</div>${cols.filter(c=>c[2]&&c[2]!=='PK').map(c=>`<div class="relation"><code>${c[0]}</code>${icon('arrow')}<button class="link" data-table="${c[2]}">${c[2]}.id</button></div>`).join('')||'<small>Referenced by tasks and projects</small>'}</div><details><summary>Original CREATE statement</summary><pre>${esc(ddl())}</pre><button class="outline" data-action="copy-ddl">Copy SQL</button></details>`;}
function renderMap(){const positions={people:[18,31],projects:[335,31],tasks:[190,170]},fields={people:['id  INTEGER  PK','name  TEXT'],projects:['id  INTEGER  PK','owner_id → people'],tasks:['id  INTEGER  PK','project_id → projects','assignee_id → people']};$('#schema-map').setAttribute('viewBox',`0 0 ${600/state.zoom} ${290/state.zoom}`);$('#schema-map').innerHTML='<path class="map-edge" d="M335 91C270 91 270 60 208 60M241 170C241 133 105 155 105 113M335 170C335 145 420 150 420 113"/>'+Object.keys(positions).map(t=>{const [x,y]=positions[t];return `<g class="map-node ${state.map===t?'selected':''}" data-node="${t}" tabindex="0" role="button" aria-label="Select ${t}" transform="translate(${x} ${y})"><rect width="190" height="${state.mapColumns?(t==='tasks'?102:82):43}" rx="7"/><text class="node-name" x="13" y="24">${t}</text><text class="field" x="153" y="24">${rows(t).length}</text>${state.mapColumns?`<line x1="0" x2="190" y1="35" y2="35"/>${fields[t].map((f,i)=>`<text class="field ${i===0?'pk':f.includes('→')?'fk-field':''}" x="13" y="${53+i*17}">${f}</text>`).join('')}`:''}</g>`;}).join('');$('#map-selection').textContent=state.map;$('#zoom-label').textContent=`${Math.round(state.zoom*100)}%`;}
function render(){renderSidebar();renderGrid();renderRecord();renderStructure();renderMap();syncLayout();}
function stage(field,value){if(!state.editing)return;const row=rows().find(r=>r.id===state.selection);if(!row)return;const key=`${state.table}:${row.id}`,after={...displayed(row),[field]:value};if(JSON.stringify(after)===JSON.stringify(row))state.drafts.delete(key);else state.drafts.set(key,{table:state.table,id:row.id,before:{...row},after});renderGrid();renderRecord();}
function commit(){if(!state.drafts.size)return;const next=structuredClone(databases[state.database]);for(const d of state.drafts.values()){const list=next[d.table];if(d.inserted)list.push(d.after);else if(d.deleted)list.splice(list.findIndex(r=>r.id===d.id),1);else Object.assign(list.find(r=>r.id===d.id),d.after);}const invalid=Object.keys(schema).some(t=>schema[t].some(([col,,rel])=>rel&&rel!=='PK'&&next[t].some(r=>!next[rel].some(p=>p.id===r[col]))));if(invalid){toast('Foreign key conflict · no changes committed; drafts retained');return;}databases[state.database]=next;const n=state.drafts.size;state.drafts.clear();if(!rows().some(r=>r.id===state.selection))state.selection=rows()[0]?.id;closeDialog();render();toast(`${n} ${n===1?'change':'changes'} committed to the demo dataset`);}
const sqlValue=v=>typeof v==='number'?String(v):"'"+String(v).replaceAll("'","''")+"'";
function reviewSql(d){if(d.deleted)return `DELETE FROM ${d.table} WHERE id = ${d.id};`;if(d.inserted)return `INSERT INTO ${d.table} (${Object.keys(d.after).join(', ')}) VALUES (${Object.values(d.after).map(sqlValue).join(', ')});`;return `UPDATE ${d.table} SET ${Object.keys(d.after).filter(k=>d.before[k]!==d.after[k]).map(k=>`${k} = ${sqlValue(d.after[k])}`).join(', ')} WHERE id = ${d.id};`;}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard');}catch{showDialog('Copy text',`<textarea style="width:100%;height:180px" readonly>${esc(text)}</textarea><p class="muted">Select and copy the text.</p>`);}}
function runQuery(explain=false){const sql=$('#query').value.trim(),match=sql.match(/^SELECT\s+(.+?)\s+FROM\s+(tasks|projects|people)(?:\s+WHERE\s+(\w+)\s*=\s*'([^']*)')?\s*;?$/is);if(!match){$('#query-result').textContent="This mockup supports SELECT columns FROM tasks, projects, or people, optionally with WHERE column = 'value'.";return;}const [,selection,table,field,value]=match,columns=selection==='*'?schema[table].map(c=>c[0]):selection.split(',').map(c=>c.trim());if(columns.some(c=>!schema[table].some(x=>x[0]===c))||(field&&!schema[table].some(c=>c[0]===field))){$('#query-result').textContent='Unknown column in the demo schema.';return;}const result=rows(table).filter(r=>!field||String(r[field])===value);state.history.unshift(sql);$('#query-result').innerHTML=explain?`<span class="pill review">Demo plan</span><p style="margin-top:7px">SCAN ${table}${field?` → filter ${esc(field)}`:''} → return ${result.length} rows</p>`:`<div class="muted" style="margin-bottom:5px">${result.length} rows · demo dataset</div><table><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${result.map(r=>`<tr>${columns.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table>`;}
const actions={
'add-filter':()=>$('#row-filter').focus(),'apply-filter':()=>{state.filter=$('#row-filter').value.trim();state.status=$('#status-filter').value;state.page=0;renderGrid();},'clear-filter':()=>{state.filter='';state.status='';$('#row-filter').value='';$('#status-filter').value='';state.page=0;renderGrid();},previous:()=>{state.page--;renderGrid();},next:()=>{state.page++;renderGrid();},refresh:()=>{render();toast('Demo data refreshed');},access:()=>{if(state.editing&&state.drafts.size){toast('Commit or discard staged edits before switching to read only');return;}state.editing=!state.editing;renderRecord();toast(state.editing?'Editing enabled · changes are staged until you commit':'Read-only access');},discard:()=>{state.drafts.clear();render();toast('Staged edits discarded');},commit,
review:()=>showDialog('Review staged changes',state.drafts.size?`${[...state.drafts.values()].map(d=>`<div class="review-entry"><strong>${d.table} · row ${d.id}</strong>${d.deleted?'<p>Delete record</p>':d.inserted?'<p>Insert record</p>':Object.keys(d.after).filter(k=>d.before[k]!==d.after[k]).map(k=>`<p>${k}: <del>${esc(d.before[k])}</del> → <ins>${esc(d.after[k])}</ins></p>`).join('')}<pre>${esc(reviewSql(d))}</pre></div>`).join('')}<div class="dialog-actions"><button data-action="close-dialog">Keep editing</button><button class="primary" data-action="commit">Commit ${state.drafts.size}</button></div>`:'<p>No staged edits.</p>'),
'copy-record':()=>copy(JSON.stringify(displayed(rows().find(r=>r.id===state.selection)||{}),null,2)),'copy-ddl':()=>copy(ddl()),delete:()=>{if(!state.editing){toast('Enable Editing to stage a deletion');return;}const row=rows().find(r=>r.id===state.selection);if(row){state.drafts.set(`${state.table}:${row.id}`,{table:state.table,id:row.id,before:{...row},deleted:true});renderGrid();}},
clone:()=>{if(!state.editing){toast('Enable Editing to clone a record');return;}const row=rows().find(r=>r.id===state.selection);if(!row)return;const id=nextId();state.drafts.set(`${state.table}:${id}`,{table:state.table,id,after:{...displayed(row),id},inserted:true});renderGrid();toast('Clone staged with a new demo primary key');},
insert:()=>{if(!state.editing){toast('Enable Editing in the record tile to insert');return;}showDialog('Insert record',`<form id="insert-form">${schema[state.table].filter(c=>c[0]!=='id').map(([col,type])=>`<div class="form-row"><label for="insert-${col}">${col}</label><input id="insert-${col}" name="${col}" type="${type==='INTEGER'?'number':'text'}" required></div>`).join('')}<div class="dialog-actions"><button type="button" data-action="close-dialog">Cancel</button><button type="submit" class="primary">Stage insert</button></div></form>`);},
export:()=>{const list=filtered().slice(state.page*7,(state.page+1)*7),cols=schema[state.table].map(c=>c[0]),csv=[cols,...list.map(r=>cols.map(c=>r[c]))].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download=`${state.table}-visible-page.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Exported the visible page as CSV');},
'map-data':()=>tableSelect(state.map),'map-structure':()=>{tableSelect(state.map);focusTile('structure');},'map-columns':()=>{state.mapColumns=!state.mapColumns;$('[data-action=map-columns]').setAttribute('aria-pressed',state.mapColumns);renderMap();},'map-fit':()=>{state.zoom=1;renderMap();},'zoom-in':()=>{state.zoom=Math.min(1.6,state.zoom+.1);renderMap();},'zoom-out':()=>{state.zoom=Math.max(.6,state.zoom-.1);renderMap();},run:()=>runQuery(),explain:()=>runQuery(true),'save-query':()=>{state.history.unshift($('#query').value);toast('Query saved in this demo session');},
history:()=>showDialog('Query history',state.history.length?state.history.map((q,i)=>`<button class="database-option" data-query="${i}"><code style="white-space:pre-wrap">${esc(q)}</code></button>`).join(''):'<p class="muted">Run or save a query to add it here.</p>'),
databases:()=>showDialog('Open a database',`<p class="muted">Choose a synthetic database for this interactive mockup.</p>${Object.keys(databases).map(name=>`<button class="database-option" data-database="${name}">${icon('db')}<span><strong>${name}</strong><small>Three tables · a separate demo dataset</small></span>${icon('arrow')}</button>`).join('')}`),
checks:()=>showDialog('Database checks',`<p class="muted">Demo dataset validation</p><div class="review-entry">Records <strong style="float:right">${Object.keys(schema).reduce((n,t)=>n+rows(t).length,0)}</strong></div><div class="review-entry">Unresolved task references <strong style="float:right">${rows('tasks').filter(t=>!rows('projects').some(p=>p.id===t.project_id)||!rows('people').some(p=>p.id===t.assignee_id)).length}</strong></div><p class="muted" style="margin-top:12px">Native integrity and journal checks will use the database engine in the application.</p>`),
settings:()=>showDialog('Appearance & cell presentation',`<div class="form-row"><span class="spacer">Appearance</span><span class="chip">System theme</span></div><p class="muted" style="margin-top:8px">Light and dark follow your system automatically.</p><div class="form-row"><label for="presentation">Cell presentation</label><select id="presentation"><option value="auto" ${state.presentation==='auto'?'selected':''}>Auto · pills, bars, FK labels</option><option value="plain" ${state.presentation==='plain'?'selected':''}>Manual · plain values</option></select></div><p class="muted" style="margin-top:12px">Display choices do not change the stored values.</p>`),
help:()=>showDialog('A fixed workspace','<ul class="help-list"><li>Five tiles have fixed positions. They cannot be moved.</li><li>Open tiles combine context and grouped icon actions in one compact ribbon. Only minimized tiles become header bars.</li><li>Minimize reduces a tile to a compact header bar.</li><li>Expand fills the workspace, keeping navigation visible.</li><li>Restore returns the other tiles to their previous states.</li><li><kbd>Esc</kbd> restores an expanded tile. <kbd>Ctrl K</kbd> searches the schema. <kbd>Ctrl Enter</kbd> runs the focused SQL editor.</li><li>Filters search all demo rows before paging.</li></ul>'),
objects:()=>showDialog('Other schema objects','<p class="muted">Object counts illustrate the proposed navigator. The three demo tables have interactive columns, records, and relationships.</p>'),'close-dialog':closeDialog,'restore-all':()=>{state.minimized.clear();state.full=null;syncLayout();}
};
function nextId(){return Math.max(0,...rows().map(r=>r.id),...[...state.drafts.values()].filter(d=>d.table===state.table).map(d=>d.id))+1;}
$$('.tile').forEach(tile=>{const id=tile.dataset.tile;tile.insertAdjacentHTML('afterbegin',`<div class="tile-controls"><button class="icon-button" data-minimize="${id}" title="Minimize ${names[id]} to a header" aria-label="Minimize ${names[id]} to a header">${icon('min')}</button><button class="icon-button" data-expand="${id}" title="Expand ${names[id]} to workspace" aria-label="Expand ${names[id]} to workspace">${icon('expand')}</button></div><div class="collapsed-bar">${icon(({data:'table',map:'map',record:'person',structure:'table',sql:'code'})[id])}<button class="restore-label" data-restore="${id}" title="Restore ${names[id]}">${names[id]}</button><button class="icon-button" data-expand="${id}" title="Expand ${names[id]} to workspace" aria-label="Expand minimized ${names[id]} to workspace">${icon('expand')}</button></div>`);});
 document.addEventListener('click',e=>{const target=e.target.closest('button,[data-row],[data-node]');if(!target)return;const d=target.dataset;if(d.minimize)minimize(d.minimize);else if(d.expand)expand(d.expand);else if(d.restore){state.minimized.delete(d.restore);syncLayout();$(`[data-tile="${d.restore}"] [data-minimize]`).focus();}else if(d.focus)focusTile(d.focus);else if(d.table)tableSelect(d.table);else if(d.parent)tableSelect(d.parent,Number(d.id));else if(d.node){state.map=d.node;renderMap();}else if(d.row){state.selection=Number(d.row);renderGrid();renderRecord();}else if(d.action)actions[d.action]?.();else if(d.database){if(state.drafts.size){toast('Commit or discard staged edits before switching databases');return;}state.database=d.database;state.editing=false;state.selection=rows()[0]?.id;$('#database-name').textContent=d.database;$('#status-database').textContent=d.database;closeDialog();render();toast(`Opened ${d.database} · synthetic workspace`);}else if(d.query!==undefined){$('#query').value=state.history[Number(d.query)];closeDialog();focusTile('sql');}});
 document.addEventListener('change',e=>{if(e.target.dataset.field)stage(e.target.dataset.field,e.target.value);if(e.target.id==='presentation'){state.presentation=e.target.value;renderGrid();}});
$('#schema-search').addEventListener('input',renderSidebar);$('#row-filter').addEventListener('keydown',e=>{if(e.key==='Enter')actions['apply-filter']();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open&&state.full){const id=state.full;state.full=null;syncLayout();$(`[data-tile="${id}"] [data-expand]`).focus();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#schema-search').focus();}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.id==='query'){e.preventDefault();runQuery();}if(e.key==='Enter'&&e.target.matches('[data-row],[data-node]'))e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));});
 document.addEventListener('submit',e=>{if(e.target.id!=='insert-form')return;e.preventDefault();const values=Object.fromEntries(new FormData(e.target)),id=nextId(),after={id};for(const [col,type]of schema[state.table].filter(c=>c[0]!=='id'))after[col]=type==='INTEGER'?Number(values[col]):values[col];state.drafts.set(`${state.table}:${id}`,{table:state.table,id,after,inserted:true});closeDialog();renderGrid();toast('Insert staged · review or commit when ready');});
render();
</script>
</body></html>
